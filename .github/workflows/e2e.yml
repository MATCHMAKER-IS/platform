name: E2E
on:
  pull_request:
  push:
    branches: [main]

# **必要な権限だけを与える。** 既定の GITHUB_TOKEN は広い権限を持つため、
# 明示して絞る（漏れたトークンでできることを減らす）
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        # **開発・本番と同じ 17 に揃える。** 2026-08 まで 16 だった
        # ——**本番と違う DB で通っても意味が薄い**(17 で動かない SQL が 16 で通る)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      MAIL_FROM: no-reply@example.co.jp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install  # TODO: pnpm-lock.yaml をコミットしたら --frozen-lockfile に戻す
      # **方式は tools/apply-schema.mjs が選ぶ**(migrations/ の有無を見る)。
      # E2E は毎回まっさらな DB なので、履歴が無い間は db push で足りる(ADR 0013)
      - run: node tools/apply-schema.mjs internal-app
      - run: pnpm --filter internal-app exec playwright install --with-deps chromium
      - run: pnpm --filter internal-app e2e
