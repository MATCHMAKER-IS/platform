# 外部SaaSとの契約テスト（週次）。
#
# 目的: freee / Google / PayPal などの API が「こちらの知らないうちに変わった」ことを、
#       利用者からの連絡ではなく CI で先に検知する。
#
# 動き:
#   1. 認証情報（Secrets）があるコネクタだけ、本物の API に問い合わせて応答を記録する
#   2. 記録した応答に、実装が依存するフィールドが揃っているか厳格モードで検査する
#   3. 欠けていれば失敗 → Issue で気づける
#
# Secrets が未設定の場合は記録をスキップし、契約と実装のズレ（C003）だけを見る。
name: contract

on:
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 6:00 JST
  workflow_dispatch: # 手動実行（連携先の障害調査時など）

# **必要な権限だけを与える。** 既定の GITHUB_TOKEN は広い権限を持つため、
# 明示して絞る（漏れたトークンでできることを減らす）
permissions:
  contents: read
  issues: write  # 失敗を Issue で知らせる

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 契約と実装のズレを検査（認証情報不要）
        run: node tools/check-contract.mjs

      - name: 実応答を記録（認証情報がある場合のみ）
        env:
          FREEE_CLIENT_ID: ${{ secrets.FREEE_CLIENT_ID }}
          FREEE_CLIENT_SECRET: ${{ secrets.FREEE_CLIENT_SECRET }}
          FREEE_REFRESH_TOKEN: ${{ secrets.FREEE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DATA_CENTER: ${{ secrets.ZOHO_DATA_CENTER }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # **Bot と友だちになっている人の userId。** プロフィール取得には実在の ID が要る。
          # 値は記録に残らない(record-contract が伏せる)。
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # **インテグレーションに共有済みのページ ID。** 共有していないと 404 になる
          NOTION_TEST_PAGE_ID: ${{ secrets.NOTION_TEST_PAGE_ID }}
        run: node tools/record-contract.mjs

      - name: 厳格モードで検査（未記録・期限切れも失敗）
        env:
          CONTRACT_STRICT: "1"
        run: node tools/check-contract.mjs
        continue-on-error: true # 認証情報の整備前に赤くし続けない。整えたら false にする

      - name: 記録の差分を表示
        if: always()
        run: git --no-pager diff --stat tests/contracts || true
