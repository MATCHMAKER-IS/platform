name: CI

on:
  push:
    branches: [main]
  pull_request:

# **必要な権限だけを与える。** 既定の GITHUB_TOKEN は広い権限を持つため、
# 明示して絞る（漏れたトークンでできることを減らす）
permissions:
  contents: read
  pull-requests: write  # PR にコメントする

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4  # バージョンは package.json の packageManager を使用
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # **`--frozen-lockfile` を必ず付ける。** これが無いと、pnpm は
        # package.json とのズレを黙って埋めてしまい、**CI ごとに違う依存**で
        # ビルドされる。2026-08 の型エラー見落とし(zoho の 4 サービスが
        # 型検査を通らないまま放置)は、ここが緩かったことと同じ根にある。
        # `tools/check-lockfile.mjs` は、この行が落ちる条件を手元で先取りする検査。
        run: pnpm install --frozen-lockfile
      # **アプリ名を並べない。** 増減のたびに追随が漏れる
      # (2026-08 のアプリ統合で、ここを含む 7 か所が古いまま壊れた)。
      # `pnpm db generate all` は tools/db.mjs が apps/ から対象を集める。
      #
      # postinstall でも生成しているので通常は重複するが、**保険として残す**。
      # `SKIP_POSTINSTALL_GENERATE=1` や install の失敗で飛ばされたとき、
      # ここが無いと typecheck が「generated が無い」で落ちて原因が分かりにくい。
      - name: Prisma generate (全アプリ)
        run: pnpm db generate all
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      - name: i18n coverage check
        run: node tools/i18n-check.mjs --catalog=apps/showcase/src/i18n/catalog.ts#catalogs
      - name: Prisma schema check (offline lint)
        run: node tools/check-schema.mjs
      - name: Prisma validate
        run: PRISMA_SCHEMA=../../apps/internal-app/prisma/schema.prisma pnpm --filter @platform/db exec prisma validate
      - name: Smoke (dependency-free logic checks)
        run: pnpm smoke
      # **カバレッジを実際に測る。** `packages/config/vitest.preset.mjs` には
      # 2026-08 まで `thresholds: { lines: 80 }` が書いてあったが、
      # `--coverage` を一度も付けていなかったため**評価されたことが無かった**。
      - name: Unit tests (カバレッジ計測つき)
        run: pnpm test:coverage
      # 下がっていたら落とす(下限は tools/coverage-floor.json)。
      - name: カバレッジが下がっていないか
        run: node tools/check-coverage.mjs
      - name: Build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          MAIL_FROM: "ci@example.com"
          SESSION_SECRET: "ci-session-secret-for-build-only"
          # 本番では必須（環境ごとに別の塩）。CI はビルドが通ればよいのでダミー
          SESSION_SALT: "ci-session-salt-for-build-only"
        run: pnpm -r build

      # **JS は黙って増える。** ライブラリを 1 つ入れるたびに数十 KB 増え、
      # どれが効いたか分からないまま重くなる。**増えた PR で気づく**ためにここで見る
      # (上限は tools/bundle-size-limit.json。未設定なら skip)
      - name: 初期 JS が増えていないか
        run: node tools/check-bundle-size.mjs

  e2e:
    runs-on: ubuntu-latest
    # **DB を用意する。** crud-template は PostgreSQL 前提で、
    # 無いと dev サーバが起動せず `webServer` が 120 秒でタイムアウトする
    # （出るのは「Timed out waiting 120000ms」だけで原因が分からない）。
    services:
      postgres:
        # **開発・本番と同じ 17 に揃える**(docker-compose も 17)。
        # 本番と違う DB で通っても意味が薄い(17 で動かない SQL が 16 で通る)。
        # smoke がワークフロー間のバージョン揃えを見張っている。
        image: postgres:17
        env:
          # **CI 内で立てるコンテナの設定**(外に漏れない値)。
          # `e2e.yml` と揃える——揃えないと `check-workflows` の W002 に当たる。
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # **`continue-on-error` は置かない。** 落ちても緑になる検査は、
    # 無いのと同じ(preflight が skip を ✅ で描いて事故った件と同じ構図)。
    # E2E が不安定で止められないときは、**この行を戻すのではなく**
    # 不安定なテストに `test.fixme` を付けて理由を残すこと。
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4  # バージョンは package.json の packageManager を使用
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # **`--frozen-lockfile` を必ず付ける。** これが無いと、pnpm は
        # package.json とのズレを黙って埋めてしまい、**CI ごとに違う依存**で
        # ビルドされる。2026-08 の型エラー見落とし(zoho の 4 サービスが
        # 型検査を通らないまま放置)は、ここが緩かったことと同じ根にある。
        # `tools/check-lockfile.mjs` は、この行が落ちる条件を手元で先取りする検査。
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # **前提を揃える。** `tools/e2e.mjs` は DB・Prisma クライアント・`.env` を
      # 先に確認して落とす。2026-08 まで CI はどれも用意しておらず、
      # **E2E は 100% 失敗していた**(`continue-on-error: true` で緑に見えていた)。
      #
      # crud-template は `app_crud` を使う。DB 名はサービスの既定(`app`)と違うので、
      # ここで作る。showcase は DB を使わない。
      - name: DB を用意する（crud-template 用）
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE app_crud' || true

      - name: .env を用意する（存在するアプリのぶんだけ）
        run: |
          for d in apps/*/; do
            if [ -f "$d/.env.example" ] && [ ! -f "$d/.env" ]; then
              cp "$d/.env.example" "$d/.env"
              echo "作成: $d.env"
            fi
          done

      - name: Prisma クライアントを生成
        run: pnpm db generate all

      # **方式は tools/apply-schema.mjs が選ぶ**(migrations/ の有無を見る)。
      # 履歴が無い間は `db push`(ADR 0013)、baseline 後は `migrate deploy`(ADR 0014)。
      # ここに `db push` と書き固定すると、切り替えた日に
      # **CI だけ古い方式のまま**になり、本番との食い違いに気づけない。
      # (かつて `migrate deploy` 固定で、履歴が無くテーブル不在のまま E2E が落ちた)
      - name: スキーマを反映（crud-template）
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_crud
        run: node tools/apply-schema.mjs crud-template

      # **存在しないアプリのテストは自動で skip される**(e2e/_apps.ts)。
      # 基盤の CI に居るのは showcase と crud-template だけ(ADR 0021)。
      - name: E2E
        run: pnpm e2e

  boundaries:
    name: 依存境界・公開API検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tools/doctor.mjs  # 環境診断(Node/生成物 等)。必須項目 NG なら失敗
      # 42 種類の検査を一括で流す（内訳は docs/ops/CHECKS.md）。
      # **最後に verify-checks が「検査そのものが生きているか」を確かめる**。
      # 検査が緑でも、対象範囲が抜けていて何も見ていないことがある
      # （実際に check-a11y が packages を見ておらず、違反 10 件が放置されていた）。
      - run: node tools/preflight.mjs
      - run: node tools/check-generated.mjs  # 生成物(module-list/advisor-report)の drift 検出
      - run: node tools/check-win-setup.mjs  # Windows セットアップ(ps1/bat)の静的検証

  windows-scripts:
    name: Windows スクリプト検証 (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # PowerShell 構文の解析(パースエラーがあれば失敗)
      - name: PowerShell 構文チェック
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/setup.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "setup.ps1: 構文 OK"
      # PSScriptAnalyzer による静的解析(警告以上で失敗)
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path scripts/setup.ps1 -Settings scripts/PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize; Write-Error "PSScriptAnalyzer が指摘を検出しました"; exit 1 }
          Write-Host "PSScriptAnalyzer: 指摘なし"
      # 軽量チェックも Windows 上で実行(ubuntu と二重の保険)
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: setup スクリプト静的検査
        run: node tools/check-win-setup.mjs

      # smoke を Windows でも走らせる。
      #
      # **開発者は Windows、CI は Linux** という食い違いが、実際に事故を生んだ。
      # 2026-08 に smoke が Windows でだけ落ちる問題を 4 種類踏んでいる:
      #   1. `/tmp` の直書き（Windows に無い）
      #   2. 動的 import に絶対パス（`C:\...` が `c:` プロトコルと解釈される）
      #   3. 生成コードへのパス埋め込み（同上）
      #   4. URL とパスの混同（`.pathname` が `/C:/...` になる）
      #
      # どれも Linux では通るため、**手元で試すまで誰も気づけなかった**。
      # smoke は依存のインストールが要らないので、ここで走らせても速い。
      - name: Smoke（Windows でも通ること）
        run: node --experimental-strip-types tools/smoke.mjs

      # Windows のパス長 260 文字。pnpm は深い階層を作るため、
      # 浅い場所に置かないと超える（実測 265 文字で踏んだ）
      - name: パス長の確認
        run: node tools/check-path-length.mjs
        continue-on-error: true  # node_modules が無いと測れないため、参考情報として出す

  # CI が失敗したとき、失敗ジョブのログを取得して要約し、PR にコメントする。
  # ci-log-report.mjs でステップ別の失敗理由・エラー行を抽出する。
  ci-log-summary:
    name: CI 失敗ログ要約を PR へ
    runs-on: ubuntu-latest
    needs: [verify, boundaries, windows-scripts]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 失敗ジョブのログを取得して要約
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # この実行(run)の全ジョブログを ZIP で取得し、テキストを結合して解析にかける。
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs" > logs.zip || echo "ログ取得に失敗(まだ書き込み中の可能性)"
          if [ -f logs.zip ]; then
            mkdir -p _logs && unzip -o -q logs.zip -d _logs || true
            cat _logs/**/*.txt 2>/dev/null | node tools/ci-log-report.mjs > ci-summary.txt || true
          fi
          if [ ! -s ci-summary.txt ]; then echo "❌ CI 失敗（ログ要約を生成できませんでした。Actions の詳細を確認してください）" > ci-summary.txt; fi
          cat ci-summary.txt
      - name: PR にコメント(失敗要約)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('ci-summary.txt', 'utf8');
            const marker = '## ⚠️ CI 失敗ログ要約';
            const body = `${marker}\n\n\`\`\`\n${summary}\n\`\`\`\n\n<sub>tools/ci-log-report.mjs による自動要約。詳細は Actions のログを参照。</sub>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
